[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "receipts"
version = "0.4.0"
description = "Evidence-audit tool for YouTube videos. Extracts claims, scores by evidence quality, produces a Markdown report."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Gautam"}]
keywords = ["youtube", "transcript", "audit", "evidence", "ai", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "yt-dlp>=2024.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov"]
mcp = ["mcp>=1.0"]

[project.urls]
Homepage = "https://github.com/axndj1993/receipts"
Issues = "https://github.com/axndj1993/receipts/issues"

[project.scripts]
receipts = "receipts.cli:main"
receipts-mcp = "receipts.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
